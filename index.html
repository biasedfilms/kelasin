<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1013">
  <meta name="description" content="KELASIN — a lightweight class management app for university students.">
  <title>KELASIN — Class Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/lucide-static@0.468.0/font/lucide.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">K</div>
          <div class="brand-copy">
            <strong>KELASIN</strong>
            <span>Class dashboard</span>
          </div>
        </div>

        <nav class="nav-list" aria-label="Main navigation">
          <button class="nav-item active" type="button" data-section="dashboard">
            <span class="nav-icon" aria-hidden="true" data-icon="grid"></span>
            <span>Dashboard</span>
          </button>
          <button class="nav-item" type="button" data-section="schedule">
            <span class="nav-icon" aria-hidden="true" data-icon="calendar"></span>
            <span>Schedule</span>
          </button>
          <button class="nav-item" type="button" data-section="assignments">
            <span class="nav-icon" aria-hidden="true" data-icon="list"></span>
            <span>Assignments</span>
          </button>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <div class="mini-note">
          <span class="mini-note-dot"></span>
          <div>
            <strong>Local-first</strong>
            <p>Your data stays in this browser.</p>
          </div>
        </div>
        <span class="version-label">v1.1</span>
      </div>
    </aside>

    <div class="mobile-scrim" id="mobileScrim" aria-hidden="true"></div>

    <main class="main-content">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="menuButton" type="button" aria-label="Open menu" aria-expanded="false">
          <span class="nav-icon" data-icon="menu" aria-hidden="true"></span>
        </button>
        <div class="topbar-title" id="topbarTitle">Teknik Informatika 2026 B</div>
        <div class="topbar-actions">
          <button class="icon-button" id="themeButton" type="button" aria-label="Switch to light mode"></button>
        </div>
      </header>

      <div class="page" id="page"></div>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <div>
          <p class="eyebrow" id="modalEyebrow">NEW</p>
          <h2 id="modalTitle">Add assignment</h2>
        </div>
        <button class="icon-button" id="modalClose" type="button" aria-label="Close dialog"></button>
      </div>
      <form id="modalForm" novalidate></form>
    </section>
  </div>

  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>

  <script src="js/app.js"></script>
</body>
</html>
